name: diag
on: { push: { branches: [diag] } }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: photon reverse
        run: |
          for ll in "50.0815,14.4265" "50.1000,14.4300" "29.5640,106.5850"; do
            lat=${ll%,*}; lon=${ll#*,}
            r=$(curl -s -A "My-stuff/0.1 (github.com/Ph4m1k/my-stuff)" "https://photon.komoot.io/reverse?lat=$lat&lon=$lon&limit=1" | head -c 1500 | tr '\n' ' ')
            echo "::notice title=$ll::$r"
          done
