name: Send the link reader to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the Supabase tool comes from npm (GitHub's "latest version" lookup sometimes hits a limit);
      # --yes answers its "are you sure?" question, which it can't ask here
      - name: Deploy import-link
        run: |
          npx --yes supabase@latest --version
          npx --yes supabase@latest functions deploy import-link --project-ref qzsrltvrvlqsftthibml --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
